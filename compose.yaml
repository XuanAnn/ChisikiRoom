services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: chisikiroom
      POSTGRES_USER: chisikiroom
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - '127.0.0.1:${DB_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chisikiroom']
      interval: 5s
      retries: 10
volumes:
  postgres_data:
